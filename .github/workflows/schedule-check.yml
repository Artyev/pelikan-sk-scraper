name: Temporary schedule check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show trigger and UTC time
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          echo "Trigger: $TRIGGER"
          date -u '+UTC: %Y-%m-%d %H:%M:%S'
          if [ "$TRIGGER" = "schedule" ]; then
            echo "Automatic scheduled trigger confirmed."
          else
            echo "Manual test only; automatic schedule is not confirmed."
          fi
      - name: Inspect GitHub workflow registration and scheduled runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          root = 'https://api.github.com/repos/' + os.environ['REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'PelikanScheduleDiagnostic'}

          def get(path):
              with urlopen(Request(root + path, headers=headers), timeout=30) as response:
                  return json.load(response)

          try:
              repo = get('')
              print('Default branch:', repo['default_branch'])
              workflows = get('/actions/workflows?per_page=100')['workflows']
              for workflow in workflows:
                  if workflow['path'] not in (
                      '.github/workflows/pelikan.yml',
                      '.github/workflows/schedule-check.yml'):
                      continue
                  print('Workflow:', workflow['path'], 'state:', workflow['state'])
                  result = get('/actions/workflows/' + str(workflow['id'])
                               + '/runs?event=schedule&per_page=5')
                  print('Scheduled runs recorded:', result['total_count'])
                  for run in result['workflow_runs']:
                      print(json.dumps({key: run.get(key) for key in (
                          'id', 'event', 'created_at', 'status', 'conclusion',
                          'head_branch', 'html_url')}))
          except HTTPError as exc:
              print('GitHub API returned HTTP', exc.code)
              raise SystemExit(1)
          except URLError:
              print('GitHub API network failure')
              raise SystemExit(1)
